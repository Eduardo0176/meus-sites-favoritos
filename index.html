<!DOCTYPE html>
<!-- Indica que o documento usa HTML5 -->
<html lang="pt-br">
<!-- Abre a página e define o idioma como português do Brasil -->

<head>
    <meta charset="UTF-8">
    <!-- Garante a exibição correta de acentos e caracteres especiais -->

    <title>Meus sites favoritos</title>
    <!-- Título que aparece na aba do navegador -->
</head>

<body>
    <!-- Início do corpo da página (conteúdo visível) -->

    <h1>Meus sites favoritos: Seu Nome</h1>
    <!-- Título principal do corpo da página -->

    <!-- ========== SITE 1 ========== -->
    <h1>YouTube</h1>
    <!-- Nome do site ACIMA da imagem -->
    <a href="https://www.youtube.com" target="_blank">
        <img src="youtube.png" alt="Captura de tela do site YouTube" width="400">
        <!-- Imagem do site (arquivo na mesma pasta do HTML); por estar dentro do <a>, ela também é um link (opcional) -->
    </a>
    <br>
    <a href="https://www.youtube.com" target="_blank">https://www.youtube.com</a>
    <!-- Link do site ABAIXO da imagem -->
    <hr>
    <!-- Linha horizontal para separar os sites -->

    <!-- ========== SITE 2 ========== -->
    <h1>Instagram</h1>
    <!-- Nome do site ACIMA da imagem -->
    <a href="https://www.instagram.com" target="_blank">
        <img src="instagram.png" alt="Captura de tela do site Instagram" width="400">
        <!-- Imagem do Instagram, também funcionando como link -->
    </a>
    <br>
    <a href="https://www.instagram.com" target="_blank">https://www.instagram.com</a>
    <!-- Link do site ABAIXO da imagem -->
    <hr>

    <!-- ========== SITE 3 ========== -->
    <h1>GitHub</h1>
    <a href="https://github.com" target="_blank">
        <img src="github.png" alt="Captura de tela do site GitHub" width="400">
    </a>
    <br>
    <a href="https://github.com" target="_blank">https://github.com</a>
    <hr>

    <!-- ========== SITE 4 ========== -->
    <h1>Spotify</h1>
    <a href="https://www.spotify.com" target="_blank">
        <img src="spotify.png" alt="Captura de tela do site Spotify" width="400">
    </a>
    <br>
    <a href="https://www.spotify.com" target="_blank">https://www.spotify.com</a>
    <hr>

    <!-- ========== SITE 5 ========== -->
    <h1>Google</h1>
    <a href="https://www.google.com" target="_blank">
        <img src="google.png" alt="Captura de tela do site Google" width="400">
    </a>
    <br>
    <a href="https://www.google.com" target="_blank">https://www.google.com</a>

</body>
<!-- Fim do corpo da página -->
</html>
<!-- Fim do documento HTML -->
